<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>昊天生活通</title>
  <meta name="description" content="昊天生活通 · 西港生活服务与东南亚资讯。会所、外送、影视、音乐与大事件新闻，一站查看。" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div id="root"></div>
  <script>
    (function () {
      var tg = window.Telegram && window.Telegram.WebApp
      if (!tg) return
      tg.ready()
      tg.expand()
      // 7.0+ 支持关闭下滑关闭手势，避免滑动内容时误关闭；8.0+ 支持真正全屏
      if (tg.isVersionAtLeast && tg.isVersionAtLeast('7.7')) tg.disableVerticalSwipes()
      if (tg.isVersionAtLeast && tg.isVersionAtLeast('8.0') && tg.requestFullscreen && !tg.isFullscreen) {
        try { tg.requestFullscreen() } catch (e) {}
      }
    })()
  </script>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
